name: ios-simulator

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "07-ios-handoff/**"
      - ".github/workflows/ios-simulator.yml"

concurrency:
  group: ios-sim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: 07-ios-handoff/App
        run: xcodegen generate
      - name: Build for iOS Simulator (iPhone and iPad)
        working-directory: 07-ios-handoff/App
        run: |
          xcodebuild -project GoldJewel.xcodeproj -scheme GoldJewel \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: GoldJewel-simulator-app
          path: 07-ios-handoff/App/build/Build/Products/Debug-iphonesimulator/GoldJewel.app
          if-no-files-found: error
      - name: Launch on iPhone and iPad simulators
        run: |
          set -euo pipefail
          APP="07-ios-handoff/App/build/Build/Products/Debug-iphonesimulator/GoldJewel.app"
          UDIDS=$(python3 - <<'PY'
          import json, subprocess
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          picked = {}
          for runtime, devices in data["devices"].items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  name = device["name"]
                  if "iPhone" in name and "iphone" not in picked:
                      picked["iphone"] = device["udid"]
                  if "iPad" in name and "ipad" not in picked:
                      picked["ipad"] = device["udid"]
          print(picked.get("iphone", ""))
          print(picked.get("ipad", ""))
          PY
          )
          for PAIR in "iphone $(echo "$UDIDS" | sed -n '1p')" "ipad $(echo "$UDIDS" | sed -n '2p')"; do
            set -- $PAIR
            NAME=$1
            UDID=$2
            if [ -z "$UDID" ]; then echo "no $NAME simulator available"; exit 1; fi
            xcrun simctl boot "$UDID" || true
            # bootstatus has hung on hosted runners; a bounded wait is enough
            # for install to report a useful error if the device is not ready.
            sleep 25
            xcrun simctl install "$UDID" "$APP"
            xcrun simctl launch "$UDID" com.shahrdazri.goldjewel
            sleep 3
            xcrun simctl io "$UDID" screenshot "07-ios-handoff/App/build/smoke-$NAME.png"
            xcrun simctl shutdown "$UDID"
          done
      - name: Upload launch screenshots
        uses: actions/upload-artifact@v4
        with:
          name: GoldJewel-launch-screenshots
          path: 07-ios-handoff/App/build/smoke-*.png
          if-no-files-found: error
