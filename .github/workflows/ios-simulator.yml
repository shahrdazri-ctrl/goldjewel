name: ios-simulator

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "07-ios-handoff/**"
      - ".github/workflows/ios-simulator.yml"

concurrency:
  group: ios-sim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: 07-ios-handoff/App
        run: xcodegen generate
      - name: Build for iOS Simulator (iPhone and iPad)
        working-directory: 07-ios-handoff/App
        run: |
          xcodebuild -project GoldJewel.xcodeproj -scheme GoldJewel \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: GoldJewel-simulator-app
          path: 07-ios-handoff/App/build/Build/Products/Debug-iphonesimulator/GoldJewel.app
          if-no-files-found: error
